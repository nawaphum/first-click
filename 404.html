<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
        // GitHub Pages redirect ไป index.html
        var segment = '/first-click';
        var path = location.pathname.replace(segment, '');
        var redirect = segment + '/index.html#' + path + location.search + location.hash;
        location.replace(redirect);
    </script>
</head>

<body>
    Redirecting...

</html>
